<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Secure Share</title>
  
  <!-- PeerJS & QRCode ライブラリ -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Google Material Symbols (アイコン) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      max-width: 550px;
      margin: 30px auto;
      padding: 0 15px;
      color: #202124;
    }
    h2 {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: #1a73e8; font-weight: 500;
    }
    .card {
      background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .card h3 {
      display: flex; align-items: center; gap: 8px;
      margin-top: 0; font-size: 1.1em; color: #5f6368;
    }
    input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box;
      font-size: 16px; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #1a73e8; }
    
    button {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; font-weight: 500;
      background-color: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #dadce0; cursor: not-allowed; color: #80868b; }
    .secondary-btn { background-color: #f1f3f4; color: #3c4043; }
    .secondary-btn:hover { background-color: #e8eaed; }
    .danger-btn { background-color: #ea4335; }
    .danger-btn:hover { background-color: #c5221f; }

    #qrcode { display: flex; justify-content: center; margin: 15px 0; padding: 15px; background: #fff; border-radius: 8px; }
    .passcode { font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #1a73e8; text-align: center; }
    .timer { font-weight: bold; color: #ea4335; }
    #approval-area { background-color: #e8f0fe; border-left: 4px solid #1a73e8; }
    
    .status-text { font-weight: bold; color: #34a853; display: flex; align-items: center; gap: 5px; }
    .download-link {
      display: flex; align-items: center; gap: 8px; margin-top: 15px; padding: 12px;
      background-color: #e6f4ea; color: #137333; text-decoration: none;
      border-radius: 6px; font-weight: bold; justify-content: center;
    }
  </style>
</head>
<body>

  <h2><span class="material-symbols-outlined">folder_shared</span> セキュアファイル共有</h2>

  <!-- 1. デバイス設定 & 待機 -->
  <div class="card" id="setup-card">
    <h3><span class="material-symbols-outlined">devices</span> 自分のデバイス設定</h3>
    <input type="text" id="device-name" placeholder="例: かなとのスマホ">
    <button id="start-btn"><span class="material-symbols-outlined">cell_tower</span> 公開を開始する (10分間有効)</button>
  </div>

  <!-- 2. 待機中（QRコード・パスワード表示） -->
  <div class="card" id="wait-card" style="display: none;">
    <h3><span class="material-symbols-outlined">lock_open</span> 接続の受付中</h3>
    <p>有効期限: <span id="timer" class="timer">10:00</span></p>
    <div class="passcode" id="display-passcode">------</div>
    <div id="qrcode"></div>
    <button id="stop-btn" class="secondary-btn"><span class="material-symbols-outlined">cancel</span> 公開を停止</button>
  </div>

  <!-- 3. 他のデバイスへ接続（受信側） -->
  <div class="card">
    <h3><span class="material-symbols-outlined">login</span> 他のデバイスに接続</h3>
    <input type="text" id="input-passcode" maxlength="6" placeholder="6桁のパスコードを入力">
    <button id="connect-btn"><span class="material-symbols-outlined">sensors</span> 接続をリクエスト</button>
  </div>

  <!-- 4. 承認ダイアログ（送信側） -->
  <div class="card" id="approval-area" style="display: none;">
    <h3><span class="material-symbols-outlined">notification_important</span> 接続リクエスト</h3>
    <p><strong id="requester-name">未知のデバイス</strong> から接続要求が届きました。</p>
    <button id="accept-btn"><span class="material-symbols-outlined">check_circle</span> 承認して接続</button>
    <button id="reject-btn" class="danger-btn"><span class="material-symbols-outlined">block</span> 拒否</button>
  </div>

  <!-- 5. ファイル共有エリア -->
  <div class="card">
    <h3><span class="material-symbols-outlined">cloud_upload</span> ファイル共有</h3>
    <p class="status-text"><span class="material-symbols-outlined" id="status-icon">sync_disabled</span> <span id="status">未接続</span></p>
    <input type="file" id="file-input" disabled>
    <button id="send-btn" disabled><span class="material-symbols-outlined">send</span> ファイル送信</button>
    <div id="download-area"></div>
  </div>

  <script>
    let peer = null; let conn = null; let currentPasscode = ''; let timerInterval = null; let pendingConnection = null;

    const setupCard = document.getElementById('setup-card'); const waitCard = document.getElementById('wait-card');
    const deviceNameInput = document.getElementById('device-name'); const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn'); const displayPasscode = document.getElementById('display-passcode');
    const timerEl = document.getElementById('timer'); const qrcodeEl = document.getElementById('qrcode');
    const inputPasscode = document.getElementById('input-passcode'); const connectBtn = document.getElementById('connect-btn');
    const approvalArea = document.getElementById('approval-area'); const requesterNameEl = document.getElementById('requester-name');
    const acceptBtn = document.getElementById('accept-btn'); const rejectBtn = document.getElementById('reject-btn');
    const statusEl = document.getElementById('status'); const statusIcon = document.getElementById('status-icon');
    const fileInput = document.getElementById('file-input'); const sendBtn = document.getElementById('send-btn');
    const downloadArea = document.getElementById('download-area');

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('pass')) inputPasscode.value = urlParams.get('pass');
    };

    function updateStatus(text, icon, color = '#202124') {
      statusEl.textContent = text;
      statusIcon.textContent = icon;
      statusEl.parentNode.style.color = color;
    }

    startBtn.addEventListener('click', () => {
      const devName = deviceNameInput.value.trim() || '名無しデバイス';
      currentPasscode = Math.floor(100000 + Math.random() * 900000).toString();
      peer = new Peer('app-share-' + currentPasscode);

      peer.on('open', () => {
        setupCard.style.display = 'none'; waitCard.style.display = 'block';
        displayPasscode.textContent = currentPasscode;
        qrcodeEl.innerHTML = '';
        new QRCode(qrcodeEl, { text: `${window.location.origin}${window.location.pathname}?pass=${currentPasscode}`, width: 150, height: 150 });
        startTimer(600);
      });

      peer.on('connection', (connection) => {
        pendingConnection = connection;
        connection.on('data', (data) => {
          if (data.type === 'handshake') {
            requesterNameEl.textContent = data.deviceName || '未知のデバイス';
            approvalArea.style.display = 'block';
          } else { handleData(data); }
        });
      });
    });

    acceptBtn.addEventListener('click', () => {
      if (!pendingConnection) return;
      conn = pendingConnection; approvalArea.style.display = 'none'; stopPublishing();
      conn.send({ type: 'accept' }); setupActiveConnection();
    });

    rejectBtn.addEventListener('click', () => {
      if (pendingConnection) { pendingConnection.send({ type: 'reject' }); pendingConnection.close(); pendingConnection = null; }
      approvalArea.style.display = 'none';
    });

    function stopPublishing() {
      clearInterval(timerInterval); if (peer) peer.destroy();
      waitCard.style.display = 'none'; setupCard.style.display = 'block';
    }
    stopBtn.addEventListener('click', stopPublishing);

    function startTimer(seconds) {
      let timeLeft = seconds;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `${Math.floor(timeLeft / 60).toString().padStart(2, '0')}:${(timeLeft % 60).toString().padStart(2, '0')}`;
        if (timeLeft <= 0) { alert('有効期限が切れました'); stopPublishing(); }
      }, 1000);
    }

    connectBtn.addEventListener('click', () => {
      const code = inputPasscode.value.trim(); const myName = deviceNameInput.value.trim() || '名無しデバイス';
      if (code.length !== 6) return alert('6桁のパスコードを入力してください');
      const tempPeer = new Peer();
      tempPeer.on('open', () => {
        conn = tempPeer.connect('app-share-' + code);
        conn.on('open', () => {
          updateStatus('相手の承認を待っています...', 'hourglass_empty', '#fbbc05');
          conn.send({ type: 'handshake', deviceName: myName });
        });
        conn.on('data', (data) => {
          if (data.type === 'accept') { setupActiveConnection(); }
          else if (data.type === 'reject') { updateStatus('拒否されました', 'block', '#ea4335'); conn.close(); }
          else { handleData(data); }
        });
      });
    });

    function setupActiveConnection() {
      updateStatus('接続完了！', 'sync', '#34a853');
      fileInput.disabled = false; sendBtn.disabled = false;
      conn.on('close', () => { updateStatus('切断されました', 'sync_disabled', '#ea4335'); fileInput.disabled = true; sendBtn.disabled = true; });
    }

    function handleData(data) {
      if (data.file) {
        const url = URL.createObjectURL(new Blob([data.file], { type: data.fileType }));
        const link = document.createElement('a'); link.href = url; link.download = data.fileName; link.className = 'download-link';
        link.innerHTML = `<span class="material-symbols-outlined">download</span> ${data.fileName} を保存`;
        downloadArea.innerHTML = ''; downloadArea.appendChild(link);
        updateStatus('ファイルを受信しました！', 'task_alt', '#34a853');
      }
    }

    sendBtn.addEventListener('click', () => {
      const file = fileInput.files[0]; if (!file || !conn) return;
      updateStatus('送信中...', 'cloud_upload', '#1a73e8');
      conn.send({ file: file, fileName: file.name, fileType: file.type });
      updateStatus('送信完了！', 'check_circle', '#34a853');
    });
  </script>
</body>
</html>
